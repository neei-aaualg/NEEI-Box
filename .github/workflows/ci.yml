name: CI - Code Quality & Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  defaults:
      run:
        working-directory: ./src
jobs:
  quality-check:
    name: Code Quality & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-code-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier Formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript Types (opcional)
        run: npx tsc --noEmit

      - name: Build Next.js Project
        run: npm run build